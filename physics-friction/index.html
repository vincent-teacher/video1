<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理｜摩擦力：靜摩擦與動摩擦</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e293b;
  --accent:#38bdf8; --accent2:#f472b6; --accent3:#facc15;
  --ink:#f8fafc; --muted:#94a3b8; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;flex:none;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1200px 900px at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
             radial-gradient(1000px 900px at 100% 100%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));}
/* floating background particles */
.bgdots{position:absolute;inset:0;pointer-events:none;opacity:.35}
.bgdots span{position:absolute;border-radius:50%;background:var(--accent);filter:blur(1px);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-2100px)}}

/* header */
#header{position:absolute;left:0;right:0;top:0;height:200px;padding:56px 64px 0;display:flex;align-items:center;gap:24px;z-index:5}
#subjectTag{font-size:34px;font-weight:800;padding:10px 26px;border-radius:999px;background:var(--accent);color:#0b1020;letter-spacing:2px;white-space:nowrap}
#lessonTitle{font-size:38px;font-weight:700;color:var(--ink);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sectionBar{position:absolute;top:200px;left:64px;right:64px;height:64px;display:flex;align-items:center;gap:18px;z-index:5}
#sectionName{font-size:30px;color:var(--accent);font-weight:700;letter-spacing:2px}
#pageNo{margin-left:auto;font-size:28px;color:var(--muted);font-variant-numeric:tabular-nums}

/* slides */
#slides{position:absolute;left:0;right:0;top:270px;height:1250px;perspective:2000px}
.slide{position:absolute;inset:0;padding:10px 64px;visibility:hidden;opacity:0}
.slide.show{visibility:visible;opacity:1}
.slide h2{font-size:68px;line-height:1.25;font-weight:900;margin-bottom:28px;letter-spacing:1px}
.slide h2 .hl{color:var(--accent)}
.slide h3{font-size:46px;font-weight:800;margin:14px 0}
.slide p,.slide li{font-size:40px;line-height:1.6}
.slide .card{background:var(--card);border:2px solid var(--line);border-radius:32px;padding:32px 36px;margin:18px 0;backdrop-filter:blur(4px)}
.slide .big{font-size:96px;font-weight:900;color:var(--accent3)}
.slide .muted{color:var(--muted)}
.slide .c1{color:var(--accent)} .slide .c2{color:var(--accent2)} .slide .c3{color:var(--accent3)}
.slide .row{display:flex;gap:24px} .slide .row>*{flex:1}
.slide .chip{display:inline-block;padding:8px 22px;border-radius:999px;background:color-mix(in srgb,var(--accent) 25%,transparent);border:2px solid var(--accent);font-size:32px;margin:6px 8px 6px 0}
.slide .formula{font-family:"Cambria Math","Times New Roman",serif;font-size:56px;text-align:center;padding:24px;border-radius:24px;background:rgba(0,0,0,.25);border:2px dashed var(--accent)}
.slide svg{display:block;max-width:100%;overflow:visible}
.slide svg text{font-family:inherit}.slide svg text:not([fill]){fill:var(--ink)}

/* transitions (enter) */
.slide.enter-fade{animation:tFade .9s ease both}
.slide.enter-slide{animation:tSlide .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-up{animation:tUp .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-zoom{animation:tZoom .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-flip{animation:tFlip 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:center}
.slide.enter-wipe{animation:tWipe 1s cubic-bezier(.6,0,.2,1) both}
.slide.enter-circle{animation:tCircle 1.1s cubic-bezier(.6,0,.2,1) both}
.slide.enter-blur{animation:tBlur 1s ease both}
.slide.leave{visibility:visible;animation:tLeave .7s ease both}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tSlide{from{opacity:0;transform:translateX(320px)}to{opacity:1;transform:none}}
@keyframes tUp{from{opacity:0;transform:translateY(220px)}to{opacity:1;transform:none}}
@keyframes tZoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes tFlip{from{opacity:0;transform:rotateY(-80deg)}to{opacity:1;transform:none}}
@keyframes tWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tCircle{from{clip-path:circle(0% at 50% 40%)}to{clip-path:circle(150% at 50% 40%)}}
@keyframes tBlur{from{opacity:0;filter:blur(30px);transform:scale(1.08)}to{opacity:1;filter:none;transform:none}}
@keyframes tLeave{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94)}}

/* element animations: add class="a-xxx" + style="--d:1.2s" (delay after slide enters) */
.slide [class*="a-"]{opacity:0}
.slide.run .a-fadeUp{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-fade{animation:tFade .8s ease var(--d,0s) both}
.slide.run .a-pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.slide.run .a-left{animation:fromLeft .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-right{animation:fromRight .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-grow{animation:growX 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both;transform-origin:left center}
.slide.run .a-growY{animation:growY 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both;transform-box:fill-box;transform-origin:center bottom}
.slide.run .a-draw{opacity:1;stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:draw 2s ease var(--d,0s) forwards}
.slide.run .a-spin{animation:tFade .5s var(--d,0s) both,spin 8s linear var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
.slide.run .a-pulse{animation:tFade .5s var(--d,0s) both,pulse 1.8s ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
.slide.run .a-float{animation:tFade .5s var(--d,0s) both,float 3s ease-in-out var(--d,0s) infinite}
.slide.run .a-blink{animation:blink 1.2s ease-in-out var(--d,0s) infinite}
.slide.run .a-type{animation:type 1.6s steps(24) var(--d,0s) both;overflow:hidden;white-space:nowrap;display:inline-block}
@keyframes fadeUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-200px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(200px)}to{opacity:1;transform:none}}
@keyframes growX{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes growY{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes type{from{opacity:1;max-width:0}to{opacity:1;max-width:100%}}

/* subtitles */
#subs{position:absolute;left:48px;right:48px;top:1540px;height:220px;display:flex;align-items:center;justify-content:center;z-index:6}
#subText{font-size:46px;line-height:1.5;font-weight:700;text-align:center;padding:22px 36px;border-radius:28px;
  background:rgba(0,0,0,.55);border:2px solid var(--line);max-width:100%;text-shadow:0 2px 6px #000;transition:opacity .25s}
#subText:empty{opacity:0}
#subText.swap{animation:subIn .35s ease both}
@keyframes subIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;height:150px;padding:0 48px 30px;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
#progress{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.15);cursor:pointer}
#progressFill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
#progress .tick{position:absolute;top:-4px;width:4px;height:24px;background:rgba(255,255,255,.55);border-radius:2px}
#btnRow{display:flex;align-items:center;gap:22px}
#btnRow button{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#btnRow button:hover{background:rgba(255,255,255,.22)}
#btnRow #btnPlay{width:92px;height:92px;font-size:40px;background:var(--accent);color:#0b1020;border:none}
#time{margin-left:auto;font-size:32px;color:var(--muted);font-variant-numeric:tabular-nums}
#homeLink{font-size:28px;color:var(--muted);text-decoration:none;border:2px solid var(--line);padding:10px 20px;border-radius:999px}

/* start overlay */
#startOverlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
  background:rgba(5,10,25,.82);backdrop-filter:blur(8px);text-align:center;padding:80px}
#startOverlay .sTag{font-size:40px;font-weight:800;padding:12px 36px;border-radius:999px;background:var(--accent);color:#0b1020}
#startOverlay h1{font-size:84px;line-height:1.25;font-weight:900}
#startOverlay p{font-size:36px;color:var(--muted);line-height:1.6}
#startBtn{width:240px;height:240px;border-radius:50%;border:none;background:var(--accent);color:#0b1020;font-size:100px;cursor:pointer;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent);animation:ring 2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 60px transparent}}
#endOverlay{position:absolute;inset:0;z-index:19;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:rgba(5,10,25,.8);text-align:center}
#endOverlay h1{font-size:80px}
#endOverlay button,#endOverlay a{font-size:40px;padding:22px 56px;border-radius:999px;border:none;background:var(--accent);color:#0b1020;font-weight:800;cursor:pointer;text-decoration:none}
</style>
</head>

xt x=\"740\" y=\"650\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">開始運動！</text></g><g class=\"a-fade\" style=\"--d:9s\"><text x=\"476\" y=\"930\" font-size=\"38\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">接觸面最多只能提供 f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max) = 40 N</text></g></svg>\n     <p class=\"muted a-fade\" style=\"--d:12s;font-size:34px\">（數值僅為示意：設最大靜摩擦力 40 N）</p>",

(--accent3)\" stroke-width=\"7\"/><path class=\"a-draw\" style=\"--len:500;--d:5s\" d=\"M130,640 L142.4,630.9 L154.8,621.9 L167.2,612.8 L179.6,603.7 L192,594.7 L204.4,585.6 L216.8,576.6 L229.2,567.6 L241.6,558.7 L254,549.7 L266.4,540.8 L278.8,531.9 L291.2,523 L303.6,514.2 L316,505.4 L328.4,496.7 L340.8,488 L353.2,479.3 L365.6,470.7 L378,462.1 L390.4,453.6 L402.8,445.2 L415.2,436.8 L427.6,428.5 L440,420.2 L452.4,412 L464.8,403.9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"7\"/><path class=\"a-draw\" style=\"--len:600;--d:7s\" d=\"M452.4,412 L464.8,403.9 L477.2,395.9 L489.6,387.9 L502,380 L514.4,372.2 L526.8,364.4 L539.2,356.8 L551.6,349.2 L564,341.7 L576.4,334.4 L588.8,327.1 L601.2,319.9 L613.6,312.8 L626,305.8 L638.4,298.8 L650.8,292.1 L663.2,285.4 L675.6,278.8 L688,272.3 L700.4,265.9 L712.8,259.7 L725.2,253.6 L737.6,247.6 L750,241.7 L762.4,235.9 L774.8,230.2 L787.2,224.7 L799.6,219.3 L812,214 L824.4,208.9 L836.8,203.9 L849.2,199 L861.6,194.3 L874,189.7\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-dasharray=\"12 10\" opacity=\".55\"/><text x=\"390\" y=\"170\" font-size=\"32\" fill=\"var(--accent)\" text-anchor=\"start\" font-weight=\"700\" class=\"a-fade\" style=\"--d:5s\">W sinθ（靜止時 = fs）</text><text x=\"730\" y=\"560\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:3s\">μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>W cosθ = f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max)</text><g class=\"a-pop\" style=\"--d:12s\"><circle cx=\"459.4\" cy=\"407.4\" r=\"16\" fill=\"#fff\"/><line x1=\"459.4\" y1=\"407.4\" x2=\"459.4\" y2=\"640\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/></g><text x=\"459.4\" y=\"732\" font-size=\"32\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fadeUp\" style=\"--d:12.5s\">tanθ = μs　即將滑下</text><rect x=\"140\" y=\"130\" width=\"319.4\" height=\"500\" fill=\"rgba(56,189,248,.08)\" class=\"a-fade\" style=\"--d:9s\"/><text x=\"300.7\" y=\"300\" font-size=\"34\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:9s\">不滑</text><g class=\"a-fadeUp\" style=\"--d:1s\"><rect x=\"20\" y=\"770\" width=\"912\" height=\"190\" rx=\"24\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"476\" y=\"830\" font-size=\"40\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan> ≤ f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max) = μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>N</text><text x=\"476\" y=\"900\" font-size=\"40\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">W sinθ ≤ μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>W cosθ ⇒ tanθ ≤ μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan></text></g><text x=\"476\" y=\"1010\" font-size=\"34\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:20s\">走山：雨水使 μs 變小 → 土塊下滑</text></svg>",
 lines:["靜摩擦力不能超過最大靜摩擦力，","化簡得 tan 西塔小於等於靜摩擦係數。","角度增大，靜摩擦力變大，最大值卻變小。","即將滑下時，tan 西塔正好等於係數。","量出這個角度，就能測得靜摩擦係數。","雨水使係數變小，就可能發生走山。"]},
{section:"範例", dur:21, trans:"zoom",
 html:"<h2 class=\"a-fadeUp\">範例 2-5：施力 F 的<span class=\"hl\">範圍</span></h2><svg viewBox=\"0 0 952 950\" width=\"952\" height=\"950\" style=\"display:block;margin:0 auto\"><g class=\"a-fadeUp\" style=\"--d:2s\"><rect x=\"10\" y=\"0\" width=\"456\" height=\"700\" rx=\"26\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"238\" y=\"60\" font-size=\"36\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">F 太小（F₁）</text><polygon points=\"50,329.1 450,560 50,560\" fill=\"rgba(148,163,184,.18)\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><g transform=\"translate(275,401.2) rotate(30)\"><rect x=\"-55\" y=\"-42\" width=\"110\" height=\"84\" rx=\"10\" fill=\"#a16207\" stroke=\"#fde68a\" stroke-width=\"4\"/><line x1=\"-41\" y1=\"-14\" x2=\"41\" y2=\"-14\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/><line x1=\"-41\" y1=\"14\" x2=\"41\" y2=\"14\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/></g><g class=\"\" style=\"--d:0s\"><line x1=\"227.4\" y1=\"373.7\" x2=\"178.9\" y2=\"345.7\" stroke=\"var(--accent2)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"158.1,333.7 192.3,334.4 175.8,363\" fill=\"var(--accent2)\"/><text x=\"138.08657048910078\" y=\"303.7286759728529\" font-size=\"38\" font-weight=\"800\" fill=\"var(--accent2)\" text-anchor=\"middle\">F₁</text></g><g class=\"\" style=\"--d:0s\"><line x1=\"253\" y1=\"439.3\" x2=\"183\" y2=\"398.9\" stroke=\"var(--accent)\" stroke-width=\"8\" stroke-linecap=\"round\"/><polygon points=\"166.4,389.3 193.8,389.9 180.6,412.8\" fill=\"var(--accent)\"/></g><g class=\"\" style=\"--d:0s\"><line x1=\"275\" y1=\"411.2\" x2=\"363.7\" y2=\"462.4\" stroke=\"#f472b6\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"14 10\"/><polygon points=\"378.9,471.2 353.8,470.7 365.9,449.7\" fill=\"#f472b6\"/></g><text x=\"238\" y=\"620\" font-size=\"28\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">有下滑趨勢 → f 沿斜面向上</text><text x=\"238\" y=\"670\" font-size=\"30\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">F₁ + μsW cosθ = W sinθ</text></g><g class=\"a-fadeUp\" style=\"--d:9s\"><rect x=\"486\" y=\"0\" width=\"456\" height=\"700\" rx=\"26\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"714\" y=\"60\" font-size=\"36\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">F 太大（F₂）</text><polygon points=\"526,329.1 926,560 526,560\" fill=\"rgba(148,163,184,.18)\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><g transform=\"translate(751,401.2) rotate(30)\"><rect x=\"-55\" y=\"-42\" width=\"110\" height=\"84\" rx=\"10\" fill=\"#a16207\" stroke=\"#fde68a\" stroke-width=\"4\"/><line x1=\"-41\" y1=\"-14\" x2=\"41\" y2=\"-14\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/><line x1=\"-41\" y1=\"14\" x2=\"41\" y2=\"14\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/></g><g class=\"\" style=\"--d:0s\"><line x1=\"703.4\" y1=\"373.7\" x2=\"542.3\" y2=\"280.7\" stroke=\"var(--accent2)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"521.5,268.7 555.7,269.4 539.2,298\" fill=\"var(--accent2)\"/><text x=\"501.50326799712377\" y=\"238.7286759728529\" font-size=\"38\" font-weight=\"800\" fill=\"var(--accent2)\" text-anchor=\"middle\">F₂</text></g><g class=\"\" style=\"--d:0s\"><line x1=\"729\" y1=\"439.3\" x2=\"799\" y2=\"479.7\" stroke=\"var(--accent)\" stroke-width=\"8\" stroke-linecap=\"round\"/><polygon points=\"815.6,489.3 788.2,488.8 801.4,465.9\" fill=\"var(--accent)\"/></g><g class=\"\" style=\"--d:0s\"><line x1=\"751\" y1=\"411.2\" x2=\"839.7\" y2=\"462.4\" stroke=\"#f472b6\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"14 10\"/><polygon points=\"854.9,471.2 829.8,470.7 841.9,449.7\" fill=\"#f472b6\"/></g><text x=\"714\" y=\"620\" font-size=\"28\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">有上移趨勢 → f 沿斜面向下</text><text x=\"714\" y=\"670\" font-size=\"30\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">F₂ = W sinθ + μsW cosθ</text></g><g class=\"a-fade\" style=\"--d:2s\"><text x=\"476\" y=\"760\" font-size=\"30\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\">虛線：W sinθ　橘：摩擦力　藍：施力</text></g><g class=\"a-pop\" style=\"--d:17s\"><rect x=\"20\" y=\"800\" width=\"912\" height=\"140\" rx=\"26\" fill=\"rgba(251,146,60,.12)\" stroke=\"var(--accent)\" stroke-width=\"4\"/><text x=\"476\" y=\"860\" font-size=\"40\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">W sinθ − μsW cosθ</text><text x=\"476\" y=\"916\" font-size=\"40\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">≤ F ≤ W sinθ + μsW cosθ</text></g></svg>",
 lines:["沿斜面向上施力 F，讓會下滑的物體平衡。","F 太小，有下滑趨勢，摩擦力沿斜面向上。","F 太大，有上移趨勢，摩擦力沿斜面向下。","F 的範圍：W sin 西塔加減係數乘 W cos 西塔。"]},

\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"696\" y1=\"424\" x2=\"674\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"730\" y1=\"424\" x2=\"708\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"764\" y1=\"424\" x2=\"742\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"798\" y1=\"424\" x2=\"776\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"832\" y1=\"424\" x2=\"810\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"866\" y1=\"424\" x2=\"844\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><line x1=\"900\" y1=\"424\" x2=\"878\" y2=\"446\" stroke=\"var(--muted)\" stroke-width=\"3\"/><g class=\"a-right\" style=\"--d:.5s\"><g transform=\"translate(560,330) rotate(0)\"><rect x=\"-100\" y=\"-85\" width=\"200\" height=\"170\" rx=\"10\" fill=\"#a16207\" stroke=\"#fde68a\" stroke-width=\"4\"/><line x1=\"-86\" y1=\"-28.333333333333332\" x2=\"86\" y2=\"-28.333333333333332\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/><line x1=\"-86\" y1=\"28.333333333333332\" x2=\"86\" y2=\"28.333333333333332\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/></g></g><g class=\"a-fade\" style=\"--d:1.5s\" stroke=\"var(--muted)\" stroke-width=\"5\" stroke-linecap=\"round\"><line x1=\"300\" y1=\"280\" x2=\"400\" y2=\"280\"/><line x1=\"260\" y1=\"330\" x2=\"400\" y2=\"330\"/><line x1=\"320\" y1=\"380\" x2=\"400\" y2=\"380\"/></g><g class=\"a-fade\" style=\"--d:2s\"><line x1=\"560\" y1=\"180\" x2=\"736\" y2=\"180\" stroke=\"#fff\" stroke-width=\"7\" stroke-linecap=\"round\"/><polygon points=\"760,180 730,196.5 730,163.5\" fill=\"#fff\"/><text x=\"660\" y=\"150\" font-size=\"34\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">v（向右滑動）</text></g><g class=\"a-fade\" style=\"--d:2.5s\"><line x1=\"660\" y1=\"330\" x2=\"836\" y2=\"330\" stroke=\"var(--accent2)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"860,330 830,346.5 830,313.5\" fill=\"var(--accent2)\"/><text x=\"840\" y=\"300\" font-size=\"40\" font-weight=\"800\" fill=\"var(--accent2)\" text-anchor=\"middle\">F</text></g><g class=\"a-pop\" style=\"--d:5s\"><line x1=\"560\" y1=\"416\" x2=\"404\" y2=\"416\" stroke=\"var(--accent)\" stroke-width=\"12\" stroke-linecap=\"round\"/><polygon points=\"380,416 410,399.5 410,432.5\" fill=\"var(--accent)\"/><text x=\"330\" y=\"470\" font-size=\"48\" font-weight=\"800\" fill=\"var(--accent)\" text-anchor=\"middle\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan></text></g><text x=\"476\" y=\"540\" font-size=\"36\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:6s\">方向：與「相對運動」方向相反</text><rect x=\"190\" y=\"590\" width=\"572\" height=\"140\" rx=\"30\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"4\" class=\"a-pop\" style=\"--d:9s\"/><text x=\"476\" y=\"685\" font-size=\"64\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"900\" class=\"a-pop\" style=\"--d:9s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> = μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> N</text><g class=\"a-fadeUp\" style=\"--d:13s\"><rect x=\"20\" y=\"780\" width=\"290\" height=\"90\" rx=\"45\" fill=\"rgba(163,230,53,.12)\" stroke=\"var(--accent3)\" stroke-width=\"3\"/><text x=\"165\" y=\"838\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">與速率無關</text><rect x=\"332\" y=\"780\" width=\"290\" height=\"90\" rx=\"45\" fill=\"rgba(163,230,53,.12)\" stroke=\"var(--accent3)\" stroke-width=\"3\"/><text x=\"477\" y=\"838\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">與接觸面積無關</text><rect x=\"644\" y=\"780\" width=\"290\" height=\"90\" rx=\"45\" fill=\"rgba(163,230,53,.12)\" stroke=\"var(--accent3)\" stroke-width=\"3\"/><text x=\"789\" y=\"838\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">與推力無關</text></g><text x=\"476\" y=\"930\" font-size=\"32\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:11s\">μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan>：動摩擦係數，無單位，由兩者材料決定</text></svg>",
 lines:["推力超過最大靜摩擦力，重物開始滑動。","此時的摩擦力稱為動摩擦力。","方向與相對運動的方向相反。","大小等於動摩擦係數乘以正向力，","與速率、接觸面積和推力都無關。"]},

 html:"<h2 class=\"a-fadeUp\">摩擦力 f 與拉力 F 的<span class=\"hl\">關係圖</span></h2><svg viewBox=\"0 0 952 940\" width=\"952\" height=\"940\" style=\"display:block;margin:0 auto\"><line x1=\"120\" y1=\"700\" x2=\"900\" y2=\"700\" stroke=\"var(--ink)\" stroke-width=\"5\"/><line x1=\"120\" y1=\"700\" x2=\"120\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"5\"/><polygon points=\"916,700 894,688 894,712\" fill=\"var(--ink)\"/><polygon points=\"120,204 108,226 132,226\" fill=\"var(--ink)\"/><text x=\"900\" y=\"760\" font-size=\"36\" fill=\"var(--ink)\" text-anchor=\"end\" font-weight=\"700\">拉力 F</text><text x=\"134\" y=\"210\" font-size=\"36\" fill=\"var(--ink)\" text-anchor=\"start\" font-weight=\"700\">摩擦力 f</text><rect x=\"124\" y=\"230\" width=\"336\" height=\"468\" fill=\"rgba(56,189,248,.07)\" class=\"a-fade\" style=\"--d:2s\"/><text x=\"290\" y=\"290\" font-size=\"40\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:2s\">靜止</text><text x=\"680\" y=\"290\" font-size=\"40\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:10s\">移動</text><path class=\"a-draw\" style=\"--len:490;--d:3s\" d=\"M120,700 L460,360\" stroke=\"var(--accent2)\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"240\" y=\"510\" font-size=\"40\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:5s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan> = F</text><circle class=\"a-pop\" style=\"--d:8s\" cx=\"460\" cy=\"360\" r=\"14\" fill=\"#fff\"/><line class=\"a-fade\" style=\"--d:8s\" x1=\"120\" y1=\"360\" x2=\"460\" y2=\"360\" stroke=\"var(--muted)\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/><text x=\"484\" y=\"334\" font-size=\"36\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"700\" class=\"a-fade\" style=\"--d:8s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max) = μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>N</text><path class=\"a-draw\" style=\"--len:600;--d:10.5s\" d=\"M460,360 L460,460 L890,460\" stroke=\"var(--accent)\" stroke-width=\"9\" fill=\"none\" stroke-linejoin=\"round\"/><line class=\"a-fade\" style=\"--d:12s\" x1=\"120\" y1=\"460\" x2=\"460\" y2=\"460\" stroke=\"var(--muted)\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/><text x=\"890\" y=\"516\" font-size=\"36\" fill=\"var(--accent)\" text-anchor=\"end\" font-weight=\"700\" class=\"a-fade\" style=\"--d:12s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> = μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan>N（定值）</text><text x=\"104\" y=\"372\" font-size=\"30\" fill=\"#fff\" text-anchor=\"end\" font-weight=\"700\" class=\"a-fade\" style=\"--d:8s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max)</text><text x=\"104\" y=\"472\" font-size=\"34\" fill=\"var(--accent)\" text-anchor=\"end\" font-weight=\"700\" class=\"a-fade\" style=\"--d:12s\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan></text><text x=\"460\" y=\"750\" font-size=\"30\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:8s\">F = fs(max)</text><g class=\"a-fadeUp\" style=\"--d:16s\"><rect x=\"20\" y=\"800\" width=\"912\" height=\"120\" rx=\"24\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"476\" y=\"878\" font-size=\"44\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> < f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max)　⇒　μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> < μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan></text></g></svg>",
 lines:["來看摩擦力與拉力的關係圖。","物體靜止時，摩擦力等於拉力，是斜直線。","拉力達到最大靜摩擦力，物體開始滑動，","摩擦力降為動摩擦力，之後保持水平。","可見動摩擦力比最大靜摩擦力小。"]},

50f\" stroke-width=\"4\" opacity=\".6\"/></g><g class=\"\" style=\"--d:0.00s\"><line x1=\"320\" y1=\"534\" x2=\"424\" y2=\"534\" stroke=\"#fff\" stroke-width=\"6\" stroke-linecap=\"round\"/><polygon points=\"440,534 420,545 420,523\" fill=\"#fff\"/><text x=\"465\" y=\"546\" font-size=\"34\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">v</text></g><g class=\"\" style=\"--d:0.00s\"><line x1=\"300\" y1=\"636\" x2=\"227.6\" y2=\"636\" stroke=\"var(--accent)\" stroke-width=\"7\" stroke-linecap=\"round\"/><polygon points=\"210,636 232,623.9 232,648.1\" fill=\"var(--accent)\"/></g><g class=\"a-pulse\" style=\"--d:8.73s\"><line x1=\"320\" y1=\"652\" x2=\"402.4\" y2=\"652\" stroke=\"var(--accent)\" stroke-width=\"7\" stroke-linecap=\"round\"/><polygon points=\"420,652 398,664.1 398,639.9\" fill=\"var(--accent)\"/></g><text x=\"750\" y=\"590\" font-size=\"30\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">物體給桌面 fk（向右）</text><text x=\"750\" y=\"650\" font-size=\"32\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">但桌面仍靜止</text><text x=\"750\" y=\"705\" font-size=\"28\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\">（桌腳另受靜摩擦力）</text></g><g class=\"a-fadeUp\" style=\"--d:14.55s\"><rect x=\"10\" y=\"790\" width=\"455\" height=\"200\" rx=\"26\" fill=\"rgba(163,230,53,.1)\" stroke=\"var(--accent3)\" stroke-width=\"3\"/><text x=\"237\" y=\"860\" font-size=\"38\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">👟 鞋底</text><text x=\"237\" y=\"930\" font-size=\"30\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">μ 大一些較好（防滑）</text></g><g class=\"a-fadeUp\" style=\"--d:16.00s\"><rect x=\"487\" y=\"790\" width=\"455\" height=\"200\" rx=\"26\" fill=\"rgba(56,189,248,.1)\" stroke=\"var(--accent2)\" stroke-width=\"3\"/><text x=\"714\" y=\"860\" font-size=\"38\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">⚙ 馬達軸承</text><text x=\"714\" y=\"930\" font-size=\"30\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\">μ 小一些較好（省能）</text></g></svg>",

{section:"範例", dur:23, trans:"wipe",
 html:"<h2 class=\"a-fadeUp\">範例 2-6：<span class=\"hl\">疊放的紙箱</span></h2><svg viewBox=\"0 0 952 1010\" width=\"952\" height=\"1010\" style=\"display:block;margin:0 auto\"><line x1=\"60\" y1=\"380\" x2=\"900\" y2=\"380\" stroke=\"var(--ink)\" stroke-width=\"5\"/><text x=\"780\" y=\"420\" font-size=\"30\" fill=\"var(--muted)\" text-anchor=\"middle\" font-weight=\"700\">光滑地面</text><g class=\"a-fadeUp\" style=\"--d:.5s\"><rect x=\"250\" y=\"270\" width=\"320\" height=\"110\" rx=\"10\" fill=\"#92400e\" stroke=\"#fde68a\" stroke-width=\"4\"/><text x=\"410\" y=\"340\" font-size=\"38\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">B 10 kg</text><rect x=\"300\" y=\"160\" width=\"220\" height=\"110\" rx=\"10\" fill=\"#b45309\" stroke=\"#fde68a\" stroke-width=\"4\"/><text x=\"410\" y=\"230\" font-size=\"38\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">A 10 kg</text></g><g class=\"a-fade\" style=\"--d:2s\"><line x1=\"570\" y1=\"325\" x2=\"736\" y2=\"325\" stroke=\"var(--accent2)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"760,325 730,341.5 730,308.5\" fill=\"var(--accent2)\"/><text x=\"790\" y=\"338\" font-size=\"46\" font-weight=\"800\" fill=\"var(--accent2)\" text-anchor=\"start\">F</text></g><g class=\"a-pulse\" style=\"--d:5s\"><line x1=\"360\" y1=\"262\" x2=\"470.8\" y2=\"262\" stroke=\"var(--accent)\" stroke-width=\"8\" stroke-linecap=\"round\"/><polygon points=\"490,262 466,275.2 466,248.8\" fill=\"var(--accent)\"/></g><text x=\"170\" y=\"230\" font-size=\"30\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:5s\">B 給 A</text><text x=\"170\" y=\"270\" font-size=\"30\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:5s\">向前摩擦力</text><text x=\"476\" y=\"80\" font-size=\"34\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:1s\">μs = 0.40　μk = 0.30　g = 10 m/s²</text><g class=\"a-fadeUp\" style=\"--d:8s\"><rect x=\"10\" y=\"470\" width=\"932\" height=\"250\" rx=\"26\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"476\" y=\"530\" font-size=\"34\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\">① 不相對滑動的最大拉力</text><text x=\"476\" y=\"590\" font-size=\"34\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">a_A(max) = μs g = 0.4 × 10 = 4 m/s²</text><text x=\"476\" y=\"660\" font-size=\"36\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">F_max = (m_A + m_B)·a = 20 × 4 = 80 N</text></g><g class=\"a-fadeUp\" style=\"--d:17s\"><rect x=\"10\" y=\"750\" width=\"932\" height=\"250\" rx=\"26\" fill=\"var(--card)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"476\" y=\"810\" font-size=\"34\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\">② F = 90 N > 80 N → A、B 相對滑動</text><text x=\"476\" y=\"870\" font-size=\"34\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">A 受動摩擦力 fk = μk m_A g</text><text x=\"476\" y=\"940\" font-size=\"38\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">a_A = μk g = 0.3 × 10 = 3 m/s²</text></g></svg>",
 lines:["素養題：A、B 各十公斤，疊在光滑地面。","拉 B 時，A 只能靠 B 給的靜摩擦力加速。","A 最大加速度為零點四乘十，等於四。","兩箱一起加速，最大拉力為八十牛頓。","拉九十牛頓時兩箱滑動，A 的加速度為三。"]},

<tspan dy=\"-0.3em\">​</tspan> = μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan>N</text></g><text x=\"476\" y=\"510\" font-size=\"30\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:10s\">方向：沿接觸面，與（趨勢）運動方向相反；μ<tspan font-size=\"0.72em\" dy=\"0.3em\">k</tspan><tspan dy=\"-0.3em\">​</tspan> < μ<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan></text><g class=\"a-fadeUp\" style=\"--d:13s\"><rect x=\"10\" y=\"550\" width=\"932\" height=\"420\" rx=\"28\" fill=\"rgba(250,204,21,.08)\" stroke=\"var(--accent3)\" stroke-width=\"3\"/><text x=\"476\" y=\"610\" font-size=\"40\" fill=\"var(--accent3)\" text-anchor=\"middle\" font-weight=\"700\">⚡ 快問快答</text><line x1=\"160\" y1=\"790\" x2=\"790\" y2=\"790\" stroke=\"var(--ink)\" stroke-width=\"4\"/><g transform=\"translate(476,730) rotate(0)\"><rect x=\"-75\" y=\"-58\" width=\"150\" height=\"116\" rx=\"10\" fill=\"#a16207\" stroke=\"#fde68a\" stroke-width=\"4\"/><line x1=\"-61\" y1=\"-19.333333333333332\" x2=\"61\" y2=\"-19.333333333333332\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/><line x1=\"-61\" y1=\"19.333333333333332\" x2=\"61\" y2=\"19.333333333333332\" stroke=\"#78350f\" stroke-width=\"4\" opacity=\".6\"/></g><g class=\"\" style=\"--d:0s\"><line x1=\"551\" y1=\"720\" x2=\"662\" y2=\"720\" stroke=\"var(--accent2)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"686,720 656,736.5 656,703.5\" fill=\"var(--accent2)\"/><text x=\"640\" y=\"690\" font-size=\"34\" font-weight=\"800\" fill=\"var(--accent2)\" text-anchor=\"middle\">30 N</text></g><text x=\"476\" y=\"850\" font-size=\"36\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\">f<tspan font-size=\"0.72em\" dy=\"0.3em\">s</tspan><tspan dy=\"-0.3em\">​</tspan>(max) = 50 N，摩擦力 = ?</text></g><g class=\"a-pop\" style=\"--d:20s\"><g class=\"\" style=\"--d:0s\"><line x1=\"401\" y1=\"786\" x2=\"290\" y2=\"786\" stroke=\"var(--accent)\" stroke-width=\"10\" stroke-linecap=\"round\"/><polygon points=\"266,786 296,769.5 296,802.5\" fill=\"var(--accent)\"/></g><text x=\"476\" y=\"930\" font-size=\"38\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">答：30 N（靜止 ⇒ fs = F）</text></g></svg>",

/* ===================== PLAYER ENGINE ===================== */
(function(){
const TOTAL = 300;                       // seconds
const $ = id => document.getElementById(id);
const stage = $('stage'), slidesEl = $('slides'), subText = $('subText');
// theme
const root = document.documentElement.style;
Object.entries(LESSON.theme||{}).forEach(([k,v])=>root.setProperty('--'+k,v));
document.title = LESSON.subject + '｜' + LESSON.title;
$('subjectTag').textContent = LESSON.subject; $('lessonTitle').textContent = LESSON.title;
$('sTag').textContent = LESSON.subject; $('sTitle').textContent = LESSON.title; $('sDesc').textContent = LESSON.desc||'';

// background particles
const bg=$('bgdots'); for(let i=0;i<26;i++){const s=document.createElement('span');const z=6+Math.random()*16;
  s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${100+Math.random()*100}%;animation-duration:${30+Math.random()*40}s;animation-delay:-${Math.random()*60}s;opacity:${.3+Math.random()*.7}`;bg.appendChild(s);}

// scale to fit
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit); fit();

// normalise durations to exactly TOTAL seconds
const rawSum = SLIDES.reduce((a,s)=>a+(s.dur||20),0);
let acc=0;
SLIDES.forEach((s,i)=>{
  s.d = (s.dur||20)*TOTAL/rawSum; s.start=acc; acc+=s.d;
  const el=document.createElement('div'); el.className='slide'; el.innerHTML=s.html; slidesEl.appendChild(el); s.el=el;
  // subtitle cue timing: proportional to text length
  const lead=0.7, tail=0.6, span=s.d-lead-tail;
  const lens=s.lines.map(t=>Math.max(4,t.replace(/\s+/g,'').length*(/[一-鿿]/.test(t)?1:0.45)));
  const sum=lens.reduce((a,b)=>a+b,0); let t=s.start+lead;
  s.cues=s.lines.map((txt,j)=>{const c={txt,start:t,end:t+span*lens[j]/sum};t=c.end;return c;});
  if(i>0){const tk=document.createElement('div');tk.className='tick';tk.style.left=(s.start/TOTAL*100)+'%';$('progress').appendChild(tk);}
});
const CUES = SLIDES.flatMap((s,i)=>s.cues.map(c=>({...c,slide:i})));

// speech
const synth = window.speechSynthesis; let muted=false, holdCue=-1, holdStart=0;
function speak(txt){
  if(!synth||muted) return;
  if(synth.speaking||synth.pending) synth.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const isEn = !/[一-鿿]/.test(txt);
  u.lang = isEn ? 'en-US' : (LESSON.lang||'zh-TW');  // default voice for that language
  u.rate = 1.0; u.pitch = 1.0;                         // 中等語速
  synth.speak(u);
}
function stopSpeech(){ if(synth) synth.cancel(); }

// state
let t=0, playing=false, last=null, curSlide=-1, curCue=-1, ended=false;
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}

function showSlide(i, animate=true){
  if(i===curSlide) return;
  const prev=SLIDES[curSlide];
  if(prev){prev.el.className='slide leave'; const pe=prev.el; setTimeout(()=>{if(pe.classList.contains('leave'))pe.className='slide';},700);}
  const s=SLIDES[i]; curSlide=i;
  s.el.className='slide';
  void s.el.offsetWidth;                                   // restart animations
  s.el.className='slide show '+(animate?('enter-'+(s.trans||'fade')):'')+' run';
  $('sectionName').textContent = '◆ '+(s.section||'');
  $('pageNo').textContent = (i+1)+' / '+SLIDES.length;
}
function setCue(k, say){
  if(k===curCue) return; curCue=k;
  if(k<0){subText.textContent='';return;}
  subText.classList.remove('swap'); void subText.offsetWidth;
  subText.textContent=CUES[k].txt; subText.classList.add('swap');
  if(say) speak(CUES[k].txt);
}
function cueAt(time){for(let k=CUES.length-1;k>=0;k--){if(time>=CUES[k].start) return time<CUES[k].end+0.6?k:-1;}return -1;}
function slideAt(time){for(let i=SLIDES.length-1;i>=0;i--) if(time>=SLIDES[i].start) return i; return 0;}

function render(say=true){
  const i=slideAt(Math.min(t,TOTAL-0.01)); showSlide(i);
  setCue(cueAt(t), say);
  $('progressFill').style.width=(t/TOTAL*100)+'%';
  $('time').textContent=fmt(t)+' / '+fmt(TOTAL);
}
function tick(now){
  if(!playing){last=null;return;}
  if(last!=null){
    let dt=(now-last)/1000; if(dt>0.5) dt=0.05;
    // keep narration in sync: if the next cue is due but the voice is still talking, hold the clock (max 3 s)
    const nk=curCue+1;
    if(!muted && synth && synth.speaking && nk<CUES.length && t+dt>=CUES[nk].start){
      if(holdCue!==nk){holdCue=nk; holdStart=now;}
      if(now-holdStart<3000) dt=0;           // after 3 s give up waiting and move on
    }
    t+=dt;
  }
  last=now;
  if(t>=TOTAL){t=TOTAL;render(false);finish();return;}
  render(true);
  requestAnimationFrame(tick);
}
function play(){ if(ended){restart();return;} playing=true; $('btnPlay').textContent='⏸';
  // re-speak the current cue when resuming
  if(curCue>=0 && !(synth&&synth.speaking)) speak(CUES[curCue].txt);
  requestAnimationFrame(tick); }
function pause(){ playing=false; $('btnPlay').textContent='▶'; stopSpeech(); }
function seek(time){ stopSpeech(); t=Math.max(0,Math.min(TOTAL-0.05,time)); ended=false; $('endOverlay').style.display='none';
  curCue=-2; holdCue=-1; render(playing); }
function finish(){ playing=false; ended=true; $('btnPlay').textContent='▶'; stopSpeech(); subText.textContent=''; $('endOverlay').style.display='flex'; }
function restart(){ ended=false; $('endOverlay').style.display='none'; curSlide=-1; curCue=-1; t=0; play(); }

$('startBtn').onclick=()=>{ $('startOverlay').style.display='none'; if(synth){synth.cancel(); synth.speak(new SpeechSynthesisUtterance(''));} t=0; render(false); curCue=-1; play(); };
$('btnPlay').onclick=()=>playing?pause():play();
$('btnPrev').onclick=()=>{const i=slideAt(t); const target=(t-SLIDES[i].start>2||i===0)?i:i-1; seek(SLIDES[target].start+0.01);};
$('btnNext').onclick=()=>{const i=slideAt(t); if(i<SLIDES.length-1) seek(SLIDES[i+1].start+0.01);};
$('btnMute').onclick=()=>{muted=!muted; $('btnMute').textContent=muted?'🔇':'🔊'; if(muted) stopSpeech(); else if(playing&&curCue>=0) speak(CUES[curCue].txt);};
$('replayBtn').onclick=restart;
$('progress').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL);};
addEventListener('keydown',e=>{ if($('startOverlay').style.display!=='none'){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();$('startBtn').click();} return; }
  if(e.code==='Space'){e.preventDefault(); playing?pause():play();}
  if(e.code==='ArrowRight') $('btnNext').click();
  if(e.code==='ArrowLeft') $('btnPrev').click();
  if(e.key==='m') $('btnMute').click(); });
// Chrome stops long speech queues while tab hidden — pause instead
document.addEventListener('visibilitychange',()=>{ if(document.hidden && playing) pause(); });
showSlide(0,false);
})();
</script>
</body>
</html>
