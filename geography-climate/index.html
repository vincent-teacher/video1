<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理｜氣候系統：氣候要素</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e293b;
  --accent:#38bdf8; --accent2:#f472b6; --accent3:#facc15;
  --ink:#f8fafc; --muted:#94a3b8; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;flex:none;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1200px 900px at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
             radial-gradient(1000px 900px at 100% 100%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));}
/* floating background particles */
.bgdots{position:absolute;inset:0;pointer-events:none;opacity:.35}
.bgdots span{position:absolute;border-radius:50%;background:var(--accent);filter:blur(1px);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-2100px)}}

/* header */
#header{position:absolute;left:0;right:0;top:0;height:200px;padding:56px 64px 0;display:flex;align-items:center;gap:24px;z-index:5}
#subjectTag{font-size:34px;font-weight:800;padding:10px 26px;border-radius:999px;background:var(--accent);color:#0b1020;letter-spacing:2px;white-space:nowrap}
#lessonTitle{font-size:38px;font-weight:700;color:var(--ink);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sectionBar{position:absolute;top:200px;left:64px;right:64px;height:64px;display:flex;align-items:center;gap:18px;z-index:5}
#sectionName{font-size:30px;color:var(--accent);font-weight:700;letter-spacing:2px}
#pageNo{margin-left:auto;font-size:28px;color:var(--muted);font-variant-numeric:tabular-nums}

/* slides */
#slides{position:absolute;left:0;right:0;top:270px;height:1250px;perspective:2000px}
.slide{position:absolute;inset:0;padding:10px 64px;visibility:hidden;opacity:0}
.slide.show{visibility:visible;opacity:1}
.slide h2{font-size:68px;line-height:1.25;font-weight:900;margin-bottom:28px;letter-spacing:1px}
.slide h2 .hl{color:var(--accent)}
.slide h3{font-size:46px;font-weight:800;margin:14px 0}
.slide p,.slide li{font-size:40px;line-height:1.6}
.slide .card{background:var(--card);border:2px solid var(--line);border-radius:32px;padding:32px 36px;margin:18px 0;backdrop-filter:blur(4px)}
.slide .big{font-size:96px;font-weight:900;color:var(--accent3)}
.slide .muted{color:var(--muted)}
.slide .c1{color:var(--accent)} .slide .c2{color:var(--accent2)} .slide .c3{color:var(--accent3)}
.slide .row{display:flex;gap:24px} .slide .row>*{flex:1}
.slide .chip{display:inline-block;padding:8px 22px;border-radius:999px;background:color-mix(in srgb,var(--accent) 25%,transparent);border:2px solid var(--accent);font-size:32px;margin:6px 8px 6px 0}
.slide .formula{font-family:"Cambria Math","Times New Roman",serif;font-size:56px;text-align:center;padding:24px;border-radius:24px;background:rgba(0,0,0,.25);border:2px dashed var(--accent)}
.slide svg{display:block;max-width:100%;overflow:visible}
.slide svg text{font-family:inherit}.slide svg text:not([fill]){fill:var(--ink)}

/* transitions (enter) */
.slide.enter-fade{animation:tFade .9s ease both}
.slide.enter-slide{animation:tSlide .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-up{animation:tUp .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-zoom{animation:tZoom .9s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-flip{animation:tFlip 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:center}
.slide.enter-wipe{animation:tWipe 1s cubic-bezier(.6,0,.2,1) both}
.slide.enter-circle{animation:tCircle 1.1s cubic-bezier(.6,0,.2,1) both}
.slide.enter-blur{animation:tBlur 1s ease both}
.slide.leave{visibility:visible;animation:tLeave .7s ease both}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tSlide{from{opacity:0;transform:translateX(320px)}to{opacity:1;transform:none}}
@keyframes tUp{from{opacity:0;transform:translateY(220px)}to{opacity:1;transform:none}}
@keyframes tZoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes tFlip{from{opacity:0;transform:rotateY(-80deg)}to{opacity:1;transform:none}}
@keyframes tWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tCircle{from{clip-path:circle(0% at 50% 40%)}to{clip-path:circle(150% at 50% 40%)}}
@keyframes tBlur{from{opacity:0;filter:blur(30px);transform:scale(1.08)}to{opacity:1;filter:none;transform:none}}
@keyframes tLeave{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94)}}

/* element animations: add class="a-xxx" + style="--d:1.2s" (delay after slide enters) */
.slide [class*="a-"]{opacity:0}
.slide.run .a-fadeUp{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-fade{animation:tFade .8s ease var(--d,0s) both}
.slide.run .a-pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.slide.run .a-left{animation:fromLeft .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-right{animation:fromRight .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.run .a-grow{animation:growX 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both;transform-origin:left center}
.slide.run .a-growY{animation:growY 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both;transform-box:fill-box;transform-origin:center bottom}
.slide.run .a-draw{opacity:1;stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:draw 2s ease var(--d,0s) forwards}
.slide.run .a-spin{animation:tFade .5s var(--d,0s) both,spin 8s linear var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
.slide.run .a-pulse{animation:tFade .5s var(--d,0s) both,pulse 1.8s ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
.slide.run .a-float{animation:tFade .5s var(--d,0s) both,float 3s ease-in-out var(--d,0s) infinite}
.slide.run .a-blink{animation:blink 1.2s ease-in-out var(--d,0s) infinite}
.slide.run .a-type{animation:type 1.6s steps(24) var(--d,0s) both;overflow:hidden;white-space:nowrap;display:inline-block}
@keyframes fadeUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-200px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(200px)}to{opacity:1;transform:none}}
@keyframes growX{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes growY{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes type{from{opacity:1;max-width:0}to{opacity:1;max-width:100%}}

/* subtitles */
#subs{position:absolute;left:48px;right:48px;top:1540px;height:220px;display:flex;align-items:center;justify-content:center;z-index:6}
#subText{font-size:46px;line-height:1.5;font-weight:700;text-align:center;padding:22px 36px;border-radius:28px;
  background:rgba(0,0,0,.55);border:2px solid var(--line);max-width:100%;text-shadow:0 2px 6px #000;transition:opacity .25s}
#subText:empty{opacity:0}
#subText.swap{animation:subIn .35s ease both}
@keyframes subIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;height:150px;padding:0 48px 30px;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
#progress{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.15);cursor:pointer}
#progressFill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
#progress .tick{position:absolute;top:-4px;width:4px;height:24px;background:rgba(255,255,255,.55);border-radius:2px}
#btnRow{display:flex;align-items:center;gap:22px}
#btnRow button{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#btnRow button:hover{background:rgba(255,255,255,.22)}
#btnRow #btnPlay{width:92px;height:92px;font-size:40px;background:var(--accent);color:#0b1020;border:none}
#time{margin-left:auto;font-size:32px;color:var(--muted);font-variant-numeric:tabular-nums}
#homeLink{font-size:28px;color:var(--muted);text-decoration:none;border:2px solid var(--line);padding:10px 20px;border-radius:999px}

/* start overlay */
#startOverlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
  background:rgba(5,10,25,.82);backdrop-filter:blur(8px);text-align:center;padding:80px}
#startOverlay .sTag{font-size:40px;font-weight:800;padding:12px 36px;border-radius:999px;background:var(--accent);color:#0b1020}
#startOverlay h1{font-size:84px;line-height:1.25;font-weight:900}
#startOverlay p{font-size:36px;color:var(--muted);line-height:1.6}
#startBtn{width:240px;height:240px;border-radius:50%;border:none;background:var(--accent);color:#0b1020;font-size:100px;cursor:pointer;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent);animation:ring 2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 60px transparent}}
#endOverlay{position:absolute;inset:0;z-index:19;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:rgba(5,10,25,.8);text-align:center}
#endOverlay h1{font-size:80px}
#endOverlay button,#endOverlay a{font-size:40px;padding:22px 56px;border-radius:999px;border:none;background:var(--accent);color:#0b1020;font-weight:800;cursor:pointer;text-decoration:none}
.geo-svg{display:block;margin:0 auto;overflow:visible}
</style>
</head>

<div id="viewport"><div id="stage">

  <div id="slides"></div>
  <div id="subs"><div id="subText"></div></div>
  <div id="controls">
    <div id="progress"><div id="progressFill"></div></div>

  <div id="startOverlay">

  "lines": [
   "氣壓是單位面積承受的空氣重量。",
   "高度愈高，上方空氣層愈薄，氣壓愈低。",
   "同一水平面上，氣溫升高時空氣膨脹變輕。",
   "密度變小形成低氣壓；變冷收縮則成高氣壓。",
   "風，就是空氣由高氣壓流向低氣壓。"

  "lines": [
   "降水強度是單位時間內的降水量。",
   "二十四小時八十毫米以上就是大雨。",
   "兩百是豪雨，三百五十大豪雨，五百超大豪雨。",
   "民國九十八年莫拉克颱風，尾寮山單日下了一千四百零二毫米！",

  "html": "<h2 class=\"a-fadeUp\">降水④：<span class=\"hl\">降水量變率</span></h2>\n<div class=\"formula card a-fadeUp\" style=\"--d:1.45s;text-align:center;font-size:38px;line-height:1.5\">變率 ＝ <span class=\"c3\">｜某年 − 平均｜</span> ÷ <span class=\"c1\">平均</span> × 100%</div>\n<svg class=\"geo-svg\" viewBox=\"0 0 952 760\" width=\"952\" height=\"760\">\n<line x1=\"80\" y1=\"600\" x2=\"900\" y2=\"600\" stroke=\"var(--muted)\" stroke-width=\"3\"/>\n<rect class=\"a-growY\" style=\"--d:12.55s\" x=\"160\" y=\"200\" width=\"200\" height=\"400\" rx=\"10\" fill=\"var(--accent)\"/>\n<rect class=\"a-growY\" style=\"--d:13.52s\" x=\"560\" y=\"300\" width=\"200\" height=\"300\" rx=\"10\" fill=\"var(--accent2)\"/>\n<text x=\"260\" y=\"180\" font-size=\"34\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:13.04s\">2,000 mm</text><text x=\"660\" y=\"280\" font-size=\"34\" fill=\"var(--ink)\" text-anchor=\"middle\" font-weight=\"700\" class=\"a-fade\" style=\"--d:14.00s\">1,500 mm</text>\n<text x=\"260\" y=\"650\" font-size=\"34\" fill=\"var(--accent)\" text-anchor=\"middle\" font-weight=\"700\">年平均</text><text x=\"660\" y=\"650\" font-size=\"34\" fill=\"var(--accent2)\" text-anchor=\"middle\" font-weight=\"700\">某年</text>\n<line x1=\"360\" y1=\"200\" x2=\"800\" y2=\"200\" stroke=\"var(--line)\" stroke-dasharray=\"10 8\" stroke-width=\"3\"/>\n<g class=\"a-pop\" style=\"--d:16.42s\"><line x1=\"800\" y1=\"205\" x2=\"800\" y2=\"295\" stroke=\"var(--accent3)\" stroke-width=\"6\"/><line x1=\"785\" y1=\"205\" x2=\"815\" y2=\"205\" stroke=\"var(--accent3)\" stroke-width=\"6\"/><line x1=\"785\" y1=\"295\" x2=\"815\" y2=\"295\" stroke=\"var(--accent3)\" stroke-width=\"6\"/><text x=\"830\" y=\"262\" font-size=\"32\" fill=\"var(--accent3)\" text-anchor=\"start\" font-weight=\"700\">差 500</text></g>\n<g class=\"a-pop\" style=\"--d:18.35s\"><rect x=\"230\" y=\"680\" width=\"500\" height=\"76\" rx=\"38\" fill=\"var(--accent3)\"/><text x=\"480\" y=\"732\" font-si    "降水量變率，是衡量降水變化程度的指標。",
   "某年與平均之差取絕對值，除以平均再乘百分百。",
   "例如平均兩千毫米，某年只下一千五百毫米。",
   "差五百，除以兩千，變率就是百分之二十五。",
   "變率大的地方，常發生乾旱或洪患。"
  ]
 },

  "lines": [
   "隨氣旋上升產生的降雨是氣旋雨，如颱風雨。",

  "lines": [
   "氣溫受緯度、高度、海陸和洋流影響。",
   "風由高壓吹向低壓，氣旋多雨、反氣旋晴朗。",
   "降水有地形、對流、氣旋、鋒面四種類型。",
   "快問快答：平均一千毫米，某年一千三百毫米？",
   "答案是變率百分之三十，你答對了嗎？"
  ]
 }
];
/* ===================== PLAYER ENGINE ===================== */
(function(){
const TOTAL = 300;                       // seconds
const $ = id => document.getElementById(id);
const stage = $('stage'), slidesEl = $('slides'), subText = $('subText');
// theme
const root = document.documentElement.style;
Object.entries(LESSON.theme||{}).forEach(([k,v])=>root.setProperty('--'+k,v));
document.title = LESSON.subject + '｜' + LESSON.title;
$('subjectTag').textContent = LESSON.subject; $('lessonTitle').textContent = LESSON.title;
$('sTag').textContent = LESSON.subject; $('sTitle').textContent = LESSON.title; $('sDesc').textContent = LESSON.desc||'';

// background particles
const bg=$('bgdots'); for(let i=0;i<26;i++){const s=document.createElement('span');const z=6+Math.random()*16;
  s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${100+Math.random()*100}%;animation-duration:${30+Math.random()*40}s;animation-delay:-${Math.random()*60}s;opacity:${.3+Math.random()*.7}`;bg.appendChild(s);}

// scale to fit
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit); fit();

// normalise durations to exactly TOTAL seconds
const rawSum = SLIDES.reduce((a,s)=>a+(s.dur||20),0);
let acc=0;
SLIDES.forEach((s,i)=>{
  s.d = (s.dur||20)*TOTAL/rawSum; s.start=acc; acc+=s.d;
  const el=document.createElement('div'); el.className='slide'; el.innerHTML=s.html; slidesEl.appendChild(el); s.el=el;
  // subtitle cue timing: proportional to text length
  const lead=0.7, tail=0.6, span=s.d-lead-tail;
  const lens=s.lines.map(t=>Math.max(4,t.replace(/\s+/g,'').length*(/[一-鿿]/.test(t)?1:0.45)));
  const sum=lens.reduce((a,b)=>a+b,0); let t=s.start+lead;
  s.cues=s.lines.map((txt,j)=>{const c={txt,start:t,end:t+span*lens[j]/sum};t=c.end;return c;});
  if(i>0){const tk=document.createElement('div');tk.className='tick';tk.style.left=(s.start/TOTAL*100)+'%';$('progress').appendChild(tk);}
});
const CUES = SLIDES.flatMap((s,i)=>s.cues.map(c=>({...c,slide:i})));

// speech
const synth = window.speechSynthesis; let muted=false, holdCue=-1, holdStart=0;
function speak(txt){
  if(!synth||muted) return;
  if(synth.speaking||synth.pending) synth.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const isEn = !/[一-鿿]/.test(txt);
  u.lang = isEn ? 'en-US' : (LESSON.lang||'zh-TW');  // default voice for that language
  u.rate = 1.0; u.pitch = 1.0;                         // 中等語速
  synth.speak(u);
}
function stopSpeech(){ if(synth) synth.cancel(); }

// state
let t=0, playing=false, last=null, curSlide=-1, curCue=-1, ended=false;
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}

function showSlide(i, animate=true){
  if(i===curSlide) return;
  const prev=SLIDES[curSlide];
  if(prev){prev.el.className='slide leave'; const pe=prev.el; setTimeout(()=>{if(pe.classList.contains('leave'))pe.className='slide';},700);}
  const s=SLIDES[i]; curSlide=i;
  s.el.className='slide';
  void s.el.offsetWidth;                                   // restart animations
  s.el.className='slide show '+(animate?('enter-'+(s.trans||'fade')):'')+' run';
  $('sectionName').textContent = '◆ '+(s.section||'');
  $('pageNo').textContent = (i+1)+' / '+SLIDES.length;
}
function setCue(k, say){
  if(k===curCue) return; curCue=k;
  if(k<0){subText.textContent='';return;}
  subText.classList.remove('swap'); void subText.offsetWidth;
  subText.textContent=CUES[k].txt; subText.classList.add('swap');
  if(say) speak(CUES[k].txt);
}
function cueAt(time){for(let k=CUES.length-1;k>=0;k--){if(time>=CUES[k].start) return time<CUES[k].end+0.6?k:-1;}return -1;}
function slideAt(time){for(let i=SLIDES.length-1;i>=0;i--) if(time>=SLIDES[i].start) return i; return 0;}

function render(say=true){
  const i=slideAt(Math.min(t,TOTAL-0.01)); showSlide(i);
  setCue(cueAt(t), say);
  $('progressFill').style.width=(t/TOTAL*100)+'%';
  $('time').textContent=fmt(t)+' / '+fmt(TOTAL);
}
function tick(now){
  if(!playing){last=null;return;}
  if(last!=null){
    let dt=(now-last)/1000; if(dt>0.5) dt=0.05;
    // keep narration in sync: if the next cue is due but the voice is still talking, hold the clock (max 3 s)
    const nk=curCue+1;
    if(!muted && synth && synth.speaking && nk<CUES.length && t+dt>=CUES[nk].start){
      if(holdCue!==nk){holdCue=nk; holdStart=now;}
      if(now-holdStart<3000) dt=0;           // after 3 s give up waiting and move on
    }
    t+=dt;
  }
  last=now;
  if(t>=TOTAL){t=TOTAL;render(false);finish();return;}
  render(true);
  requestAnimationFrame(tick);
}
function play(){ if(ended){restart();return;} playing=true; $('btnPlay').textContent='⏸';
  // re-speak the current cue when resuming
  if(curCue>=0 && !(synth&&synth.speaking)) speak(CUES[curCue].txt);
  requestAnimationFrame(tick); }
function pause(){ playing=false; $('btnPlay').textContent='▶'; stopSpeech(); }
function seek(time){ stopSpeech(); t=Math.max(0,Math.min(TOTAL-0.05,time)); ended=false; $('endOverlay').style.display='none';
  curCue=-2; holdCue=-1; render(playing); }
function finish(){ playing=false; ended=true; $('btnPlay').textContent='▶'; stopSpeech(); subText.textContent=''; $('endOverlay').style.display='flex'; }
function restart(){ ended=false; $('endOverlay').style.display='none'; curSlide=-1; curCue=-1; t=0; play(); }

$('startBtn').onclick=()=>{ $('startOverlay').style.display='none'; if(synth){synth.cancel(); synth.speak(new SpeechSynthesisUtterance(''));} t=0; render(false); curCue=-1; play(); };
$('btnPlay').onclick=()=>playing?pause():play();
$('btnPrev').onclick=()=>{const i=slideAt(t); const target=(t-SLIDES[i].start>2||i===0)?i:i-1; seek(SLIDES[target].start+0.01);};
$('btnNext').onclick=()=>{const i=slideAt(t); if(i<SLIDES.length-1) seek(SLIDES[i+1].start+0.01);};
$('btnMute').onclick=()=>{muted=!muted; $('btnMute').textContent=muted?'🔇':'🔊'; if(muted) stopSpeech(); else if(playing&&curCue>=0) speak(CUES[curCue].txt);};
$('replayBtn').onclick=restart;
$('progress').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL);};
addEventListener('keydown',e=>{ if($('startOverlay').style.display!=='none'){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();$('startBtn').click();} return; }
  if(e.code==='Space'){e.preventDefault(); playing?pause():play();}
  if(e.code==='ArrowRight') $('btnNext').click();
  if(e.code==='ArrowLeft') $('btnPrev').click();
  if(e.key==='m') $('btnMute').click(); });
// Chrome stops long speech queues while tab hidden — pause instead
document.addEventListener('visibilitychange',()=>{ if(document.hidden && playing) pause(); });
showSlide(0,false);
})();
</script>
</body>
</html>
